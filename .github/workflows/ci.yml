
name: Go CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run automated tests
        run: go test ./... -v

      - name: Build Go application
        run: go build -o web-go-prg .

  docker:
    name: Build and Publish Docker
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/gogeezy/web-go-prg:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/gogeezy/web-go-prg

  helm:
    name: Helm Lint and Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint deploy/helm/web-go-prg

      - name: Render Kubernetes manifests
        run: |
          helm template web-go-prg \
            deploy/helm/web-go-prg \
            --set image.tag=sha-test \
            > /tmp/web-go-prg.yaml

      - name: Verify Kubernetes resources
        run: |
          grep -q 'kind: Deployment' /tmp/web-go-prg.yaml
          grep -q 'kind: StatefulSet' /tmp/web-go-prg.yaml
          grep -q 'volumeClaimTemplates:' /tmp/web-go-prg.yaml
