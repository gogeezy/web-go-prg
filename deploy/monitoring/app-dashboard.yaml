apiVersion: v1
kind: ConfigMap
metadata:
  name: web-go-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  web-go-app.json: |
    {
      "uid": "web-go-app",
      "title": "Web Go App",
      "tags": ["diploma", "application"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Application Up",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 5},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{namespace=\"diploma\",job=\"diploma-web-go-prg\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "DOWN"},
                    "1": {"text": "UP"}
                  }
                }
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "HTTP Requests",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 5},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(app_http_requests_total{namespace=\"diploma\",job=\"diploma-web-go-prg\"}[$__range]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "#1F78C1", "value": 40}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP 4xx / 5xx Rate",
          "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(app_http_requests_total{namespace=\"diploma\",job=\"diploma-web-go-prg\",status=~\"4..|5..\"}[$__rate_interval]))",
              "legendFormat": "HTTP {{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request Rate by Endpoint",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 13},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (path) (rate(app_http_requests_total{namespace=\"diploma\",job=\"diploma-web-go-prg\"}[$__rate_interval]))",
              "legendFormat": "{{path}}"
            }
          ]
        }
      ]
    }
