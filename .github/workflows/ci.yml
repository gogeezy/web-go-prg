
name: Go CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run automated tests
        run: go test ./... -v

      - name: Build Go application
        run: go build -o web-go-prg .

  docker:
    name: Build and Publish Docker
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/gogeezy/web-go-prg:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/gogeezy/web-go-prg

  helm:
    name: Helm Lint and Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/web-go-prg
          helm lint deploy/helm/web-go-prg \
            -f deploy/helm/web-go-prg/values-prod.yaml

      - name: Render Kubernetes manifests
        run: |
          helm template web-go-prg \
            deploy/helm/web-go-prg \
            --set image.tag=sha-test \
            > /tmp/web-go-prg.yaml

      - name: Verify Kubernetes resources
        run: |
          grep -q 'kind: Deployment' /tmp/web-go-prg.yaml
          grep -q 'kind: StatefulSet' /tmp/web-go-prg.yaml
          grep -q 'volumeClaimTemplates:' /tmp/web-go-prg.yaml

  update-gitops:
    name: Update production image tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker, helm]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: gitops-main
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update production image tag
        shell: bash
        run: |
          git fetch origin main

          # Не разворачиваем устаревшую сборку.
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main has advanced. Skipping outdated build."
            exit 0
          fi

          git checkout -B main origin/main

          VALUES=deploy/helm/web-go-prg/values-prod.yaml

          sed -i -E \
            "s/^(  tag: )sha-[0-9a-f]{40}$/\1sha-${GITHUB_SHA}/" \
            "$VALUES"

          grep -Fxq "  tag: sha-${GITHUB_SHA}" "$VALUES"

          # Не создаём коммит, если тег уже правильный.
          if git diff --quiet -- "$VALUES"; then
            echo "Image tag is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VALUES"
          git commit -m "chore: update production image [skip ci]"
          git push origin HEAD:main
